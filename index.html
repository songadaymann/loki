<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Non-Binary</title>
    
    <style>
        /* Local font: BBH Bartle */
        @font-face {
            font-family: 'BBH Bartle';
            src: url('assets/fonts/BBH_Bartle/BBHBartle-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        
        /* Rune font for Norse elements */
        @font-face {
            font-family: 'Noto Sans Runic';
            src: url('assets/fonts/Noto_Sans_Runic/NotoSansRunic-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        
        /* Bebas Neue for instructions */
        @font-face {
            font-family: 'Bebas Neue';
            src: url('assets/fonts/Bebas_Neue/BebasNeue-Regular.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }
        
        #game-container {
            width: 100%;
            height: 100%;
        }
        
        #game-container canvas {
            display: block;
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <script src="song-cues.js"></script>
    <script src="lyrics-timing.js"></script>
    <script src="game-level.js"></script>
</body>
</html>
